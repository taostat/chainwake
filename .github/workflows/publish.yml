name: publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  integration-chainwake:
    name: Validate tagged release against local chain
    uses: ./.github/workflows/integration.yml

  validate-chainwake:
    name: Validate tagged release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          version: "0.11.33"
          enable-cache: false

      - name: Sync locked dependencies
        run: uv sync --locked --dev

      - name: Match tag to package and MCP versions
        run: uv run python scripts/check_release_version.py "$GITHUB_REF_NAME"

      - name: Audit locked runtime dependencies
        run: |
          uv export --locked --no-dev --no-emit-project \
            --output-file /tmp/chainwake-runtime-requirements.txt
          uvx --from pip-audit==2.10.1 pip-audit \
            --requirement /tmp/chainwake-runtime-requirements.txt

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run ty check

      - name: Validate JSON schema
        run: uv run python scripts/generate_json_schema.py --check

      - name: Unit tests
        run: uv run pytest -m unit -n auto

      - name: Contract tests
        run: uv run pytest tests/contracts

  build-chainwake:
    name: Build chainwake
    runs-on: ubuntu-latest
    needs: [validate-chainwake, integration-chainwake]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          version: "0.11.33"
          enable-cache: false

      - name: Build
        run: uv build

      - name: Upload dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: chainwake-dist
          path: dist/

  publish-chainwake:
    name: Publish chainwake to PyPI
    runs-on: ubuntu-latest
    needs: build-chainwake
    environment: pypi
    permissions:
      contents: read
      id-token: write  # required for PyPI trusted publisher (OIDC)
    steps:
      - name: Download dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: chainwake-dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          packages-dir: dist/
