[project]
name = "chainwake"
version = "0.5.0"
description = "Bittensor and EVM chain monitoring for AI agents."
readme = "README.md"
requires-python = ">=3.13,<3.15"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Blockmachine", email = "hello@blockmachine.io" }]
keywords = [
    "bittensor",
    "ethereum",
    "base",
    "bnb-chain",
    "bsc",
    "eip-1559",
    "agent",
    "watcher",
    "chain",
    "mcp",
    "substrate",
    "blockmachine",
    "taostat",
    "taostats",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]
dependencies = [
    "cyclopts==4.22.3",
    "pydantic==2.13.4",
    "httpx[http2]==0.28.1",
    "websockets==16.1.1",
    "apprise==1.12.0",
    "structlog==26.1.0",
    "tenacity==9.1.4",
    "async-substrate-interface==2.2.1",
    "mcp==1.28.1",
    "anyio==4.14.2",
    "uvicorn==0.52.0",
    "starlette==1.3.1",
]

[project.urls]
Homepage = "https://github.com/taostat/chainwake"
Documentation = "https://github.com/taostat/chainwake/tree/main/docs"
Repository = "https://github.com/taostat/chainwake"
Issues = "https://github.com/taostat/chainwake/issues"

[project.scripts]
chainwake = "chainwake.__main__:main"

[dependency-groups]
dev = [
    "bittensor-wallet==4.1.1",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-xdist==3.8.0",
    "pytest-timeout==2.4.0",
    "ruff==0.16.1",
    "ty==0.0.65",
    "prek==0.4.11",
    "jsonschema==4.26.0",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["chainwake"]

[tool.hatch.build.targets.sdist]
include = [
    "/chainwake",
    "/LICENSE",
    "/README.md",
    "/pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "unit: fast pure-Python tests (default)",
    "integration: tests requiring Docker Subtensor/Anvil local chains",
    "smoke: subset run in CI against live infra",
]
addopts = "-q"
# Default per-test timeout (seconds). Integration tests that legitimately
# need longer should override with `@pytest.mark.timeout(N)`. The signal
# method (SIGALRM) actually interrupts the stuck test on Unix; the thread
# method only dumps a stack and lets the loop hang. Signal is required
# for hangs inside subprocess.run() or asyncio selectors.
timeout = 90
timeout_method = "signal"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "SIM", "TID", "PL", "RUF",
    "ASYNC", "S", "PT", "PIE", "RET", "ARG", "ERA", "C4", "N",
]
ignore = [
    "PLR0913",
    "S101",
    "S603",
    "S607",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "ARG001", "ARG002"]
"scripts/**" = ["S101"]
# Stub commands declare all flags for help/schema but only use a subset.
"chainwake/cli/chains/bittensor.py" = ["ARG001"]

[tool.ruff.lint.isort]
known-first-party = ["chainwake", "chainwake.mcp"]
required-imports = ["from __future__ import annotations"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ty.environment]
python-version = "3.13"
python = ".venv"

[tool.ty.rules]
unresolved-import = "error"
unresolved-attribute = "error"
invalid-argument-type = "error"
invalid-return-type = "error"
missing-argument = "error"
unknown-argument = "error"
possibly-missing-attribute = "warn"
possibly-missing-implicit-call = "warn"
